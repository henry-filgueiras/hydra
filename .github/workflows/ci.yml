# CI for Hydra — native test matrix + WebAssembly gate.
#
# native: Debug (ASan+UBSan, wired in by CMakeLists for Debug builds)
#         and Release, on Linux and macOS.
# wasm:   the full test suite compiled with emscripten and run under
#         node (-fwasm-exceptions required — the suite exercises throw
#         paths), plus a cross-implementation smoke of the demo module
#         (Hydra vs mini-gmp must agree bit-for-bit at three widths).
#         Boost is deliberately absent from the wasm job: passing the
#         host /usr/include to emcc lets glibc headers shadow the wasm
#         sysroot.  The three-way Boost comparison runs via
#         scripts/wasm_bench.sh on a dev machine instead.
#
# Benchmarks are never gated in CI — shared runners are too noisy for
# perf assertions; see DIRECTORS_NOTES.md for the measurement protocol.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only one Pages deployment in flight at a time.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  native:
    name: native ${{ matrix.os }} / ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build-ci -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DHYDRA_BENCH_BOOST=OFF

      - name: Build tests
        run: cmake --build build-ci --target hydra_test hydra_header_check -j 4

      - name: Run tests
        run: ./build-ci/hydra_test

      - name: Header self-sufficiency
        run: ./build-ci/hydra_header_check && echo "hydra.hpp compiles standalone"

  wasm:
    name: wasm (emscripten + node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest": Hydra's wasm perf is toolchain-sensitive
      # (Binaryen's post-link wasm-opt pessimizes the Montgomery
      # kernels — see DIRECTORS_NOTES.md), so release/benchmark
      # evidence must be reproducible.  Bump deliberately, re-bench.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2

      - name: Full test suite under wasm
        run: |
          emcc -std=c++20 -O2 -DNDEBUG -I. -fwasm-exceptions \
            hydra_test.cpp hydra.cpp \
            -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=8388608 \
            -o hydra_test_wasm.js
          node hydra_test_wasm.js

      # wasm_pkg.sh needs wasm-opt for the DWARF strip; emsdk ships
      # binaryen but not on PATH — em-config fallback inside the script
      # handles it.
      - name: npm package — build + test (pkg/)
        run: scripts/wasm_pkg.sh --test

      # Source-tree tests are NOT sufficient: the tarball once shipped
      # without dist/hydra_core.wasm (package.json `files` omission)
      # while pkg/test passed against the source checkout.  This step
      # packs, installs into a fresh temp project, and runs
      # known-answer operations against the installed artifact.
      - name: npm package — packed tarball install test
        run: scripts/npm_pack_test.sh

      - name: Demo module — Hydra and mini-gmp agree
        run: |
          scripts/fetch_minigmp.sh
          emcc -O2 -DNDEBUG -c build-wasm/minigmp/mini-gmp.c \
            -o build-wasm/minigmp/mini-gmp.o
          mkdir -p build-wasm/demo
          emcc -std=c++20 -O2 -DNDEBUG -I. \
            -DHYDRA_POWMOD_GMP \
            -Ibuild-wasm/minigmp \
            demo/bench_web.cpp hydra.cpp build-wasm/minigmp/mini-gmp.o \
            -sSINGLE_FILE=1 -sMODULARIZE=1 -sEXPORT_NAME=HydraBench \
            -sENVIRONMENT=web,node \
            -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=8388608 \
            -sEXPORTED_FUNCTIONS=_hydra_bench_cell,_hydra_validate \
            -sEXPORTED_RUNTIME_METHODS=ccall,cwrap \
            -o build-wasm/demo/bench_web.js
          node -e "
            require('./build-wasm/demo/bench_web.js')().then(m => {
              const v = m.cwrap('hydra_validate', 'number', ['number']);
              for (const bits of [256, 1024, 2048]) {
                if (v(bits) !== 1) {
                  console.error('backend MISMATCH at', bits, 'bits');
                  process.exit(1);
                }
              }
              console.log('backends agree at 256/1024/2048-bit');
            });
          "

  # ── Deploy the live demo to GitHub Pages (main pushes only) ──
  # Full three-backend build (Hydra + mini-gmp + Boost).  Boost
  # headers are copied into an ISOLATED include dir first: pointing
  # emcc at /usr/include directly would let host glibc headers shadow
  # the wasm sysroot.  First-ever deploy may need Pages enabled once
  # (Settings → Pages → Source: "GitHub Actions") if the automatic
  # enablement below lacks permission.
  deploy-demo:
    name: deploy demo → GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Same pin as the wasm job — deploy artifacts must match the
      # toolchain the recorded results were measured under.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.2

      - name: Isolated Boost headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libboost-dev
          mkdir -p boost-iso
          cp -rL /usr/include/boost boost-iso/

      - name: Build demo (three backends)
        run: |
          scripts/fetch_minigmp.sh
          emcc -O2 -DNDEBUG -c build-wasm/minigmp/mini-gmp.c \
            -o build-wasm/minigmp/mini-gmp.o
          mkdir -p build-wasm/demo
          emcc -std=c++20 -O2 -DNDEBUG -I. \
            -DHYDRA_POWMOD_GMP -DHYDRA_POWMOD_BOOST \
            -Ibuild-wasm/minigmp -Iboost-iso \
            demo/bench_web.cpp hydra.cpp build-wasm/minigmp/mini-gmp.o \
            -sSINGLE_FILE=1 -sMODULARIZE=1 -sEXPORT_NAME=HydraBench \
            -sENVIRONMENT=web,node \
            -sALLOW_MEMORY_GROWTH=1 -sSTACK_SIZE=8388608 \
            -sEXPORTED_FUNCTIONS=_hydra_bench_cell,_hydra_validate,_hydra_rsa_keygen,_hydra_next_prime_str,_hydra_powmod_str \
            -sEXPORTED_RUNTIME_METHODS=ccall,cwrap \
            -o build-wasm/demo/bench_web.js
          cp demo/index.html build-wasm/demo/index.html
          node -e "
            require('./build-wasm/demo/bench_web.js')().then(m => {
              const v = m.cwrap('hydra_validate', 'number', ['number']);
              if (v(1024) !== 1) process.exit(1);
              console.log('pages build validates');
            });
          "

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-wasm/demo

      - id: deployment
        uses: actions/deploy-pages@v4
